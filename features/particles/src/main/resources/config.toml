# Text formats: MINI_MESSAGE or LEGACY_AMPERSAND.
[settings]
serializer = "MINI_MESSAGE"

# Movement and settling thresholds used by particle animation callbacks.
# Built-in effects remain visible while the player moves.
[settings.movement]
# Seconds without movement before the companion is settled.
settle-delay-seconds = 0.4
# Minimum squared distance between updates; smaller values detect finer motion.
movement-epsilon-squared = 0.00010
