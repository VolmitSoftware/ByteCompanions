# Particle storage supports H2, MYSQL, or MARIADB.
[storage]
type = "H2"

# Connection pool limits and timeouts in milliseconds.
[storage.pool]
connection-timeout = 5000
max-lifetime = 1800000
max-pool-size = 10
min-idle = 1

# External SQL credentials; ignored for embedded H2.
[storage.credentials]
host = "localhost"
port = 3306
database = "byteballoons"
username = "root"
password = "ilovefory"
use-ssl = "false"

# Directory for embedded H2 data.
[storage.h2]
path = "storage"

# Text formats: MINI_MESSAGE or LEGACY_AMPERSAND.
[settings]
serializer = "MINI_MESSAGE"

# Movement and settling thresholds used by particle animation callbacks.
# Built-in effects remain visible while the player moves.
[settings.movement]
# Seconds without movement before the companion is settled.
settle-delay-seconds = 0.4
# Minimum squared distance between updates; smaller values detect finer motion.
movement-epsilon-squared = 0.00010
