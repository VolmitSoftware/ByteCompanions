# Enable progression and boosters separately in the root config.toml.
# local creates a persistent, installation-specific scope for this database.

server-id = "local"
pause-personal-offline = true
maximum-booster-percent = 300
maximum-reward-multiplier = 10
source-cooldown-millis = 1000
allowed-worlds = []
level-thresholds = [0, 100, 300, 600]

[xp-sources]
block_break = 1
mob_kill = 5
fishing = 3

