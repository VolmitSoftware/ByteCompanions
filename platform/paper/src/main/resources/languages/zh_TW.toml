# ByteCompanions — zh_TW
#
# === 編輯檔案 ===
# plugins/ByteCompanions/languages/zh_TW.toml
# 可直接編輯此檔案。本機修改會保留；缺少或無效的項目使用內建英文文字。
# /bytecompanions language server edit zh_TW
#
# === 前綴 ===
# runtime.prefix 為 {prefix} 提供帶格式的外掛名稱。
# 從某則訊息中刪除 {prefix} 即可在該訊息中隱藏外掛名稱。
#
# === 格式 ===
# 顏色與樣式：&0-&f、&k-&r。
# RGB 顏色：&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B、[RRGGBB]。
# MiniMessage 支援 <gold> 與 <gradient:#ffcc00:#ff9900> 等自訂格式。在 & 或 [ 前加上反斜線可按原樣顯示該字元。
#
# === 變數 ===
# 請勿變更變數名稱，僅使用各則訊息中原有的變數。
#   {activation}  增幅器啟動 ID
#   {added}  語言更新中新增的訊息數
#   {after}  變更後的值
#   {amount}  數量
#   {argument}  非預期的指令參數
#   {before}  變更前的值
#   {bonus}  加成名稱
#   {booster}  增幅器 ID
#   {category}  類別名稱
#   {change}  變更說明
#   {channel}  增幅類別
#   {choice}  所選選項
#   {command}  指令路徑
#   {companion}  夥伴 ID
#   {companions}  夥伴 ID 清單
#   {count}  數量
#   {created}  建立時間
#   {current}  目前值
#   {definition}  夥伴定義
#   {detail}  失敗詳情
#   {effect}  粒子效果 ID
#   {enabled}  夥伴啟用狀態
#   {feature}  功能名稱
#   {features}  已啟用的功能
#   {field}  工作室欄位名稱
#   {formation}  隊形名稱
#   {group}  訊息類別名稱
#   {hot_reload}  熱重載狀態
#   {index}  序號
#   {integrations}  整合狀態
#   {item}  物品名稱
#   {items}  物品清單
#   {java}  Java 主要版本
#   {kept}  語言更新中保留的本機修改數
#   {key}  訊息鍵或設定鍵
#   {kind}  交易類型
#   {language}  目前語言
#   {level}  等級數值
#   {limit}  設定的上限
#   {line}  訊息行號
#   {locale}  語言代碼
#   {maximum}  允許的最大值
#   {mode}  疊加規則
#   {model}  夥伴模型
#   {money}  金額
#   {name}  顯示名稱
#   {next}  下一個值
#   {number}  清單項目編號
#   {operation}  加成運算
#   {page}  目前頁碼
#   {pages}  總頁數
#   {parameter}  參數名稱
#   {path}  檔案路徑或設定路徑
#   {percent}  百分比數值
#   {permission}  所需權限
#   {personal}  與伺服器不同時的個人語言代碼
#   {player}  玩家名稱
#   {players}  已載入的玩家數
#   {plugin}  外掛名稱
#   {prefix}  runtime.prefix 中帶格式的外掛名稱
#   {provider}  付款提供者
#   {range}  支援的 Minecraft 版本範圍
#   {reason}  失敗原因
#   {remaining}  距下次語言檢查的剩餘時間
#   {required}  所需數量
#   {scheduler}  排程器實作
#   {seconds}  持續秒數
#   {section}  語言編輯器區段
#   {sources}  加成來源
#   {status}  狀態標記
#   {step}  調整幅度
#   {target}  選取目標
#   {tier}  升級階段
#   {time}  時長文字
#   {transaction}  交易 ID
#   {type}  參數類型
#   {updated}  語言更新中變更的訊息數
#   {url}  公開報告網址
#   {usage}  指令用法
#   {value}  目前值或原始值
#   {variables}  此訊息可用的預留位置
#   {variant}  外觀變體
#   {version}  外掛版本
#   {xp}  夥伴經驗

