# ByteCompanions — he_IL
#
# === עריכת הקובץ ===
# plugins/ByteCompanions/languages/he_IL.toml
# אפשר לערוך קובץ זה ישירות. שינויים מקומיים נשמרים; ערכים חסרים או לא תקינים משתמשים באנגלית המובנית.
# /bytecompanions language server edit he_IL
#
# === קידומת ===
# runtime.prefix מספק את שם התוסף המעוצב עבור {prefix}.
# כדי להסתיר את שם התוסף בהודעה מסוימת, הסירו את {prefix} מאותה הודעה.
#
# === עיצוב ===
# צבעים וסגנונות: &0-&f, &k-&r.
# צבעי RGB: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage תומך בעיצוב מותאם, כגון <gold> ו-<gradient:#ffcc00:#ff9900>. כדי להציג & או [ כפי שהם, הוסיפו לפניהם לוכסן הפוך.
#
# === משתנים ===
# יש לשמור על שמות המשתנים ולהשתמש רק במשתנים הקיימים בכל הודעה.
#   {activation}  מזהה הפעלת המאיץ
#   {added}  הודעות שנוספו בעדכון שפה
#   {after}  הערך לאחר השינוי
#   {amount}  כמות או מספר
#   {argument}  ארגומנט פקודה לא צפוי
#   {before}  הערך לפני השינוי
#   {bonus}  שם הבונוס
#   {booster}  מזהה המאיץ
#   {category}  שם הקטגוריה
#   {change}  תיאור השינוי
#   {channel}  ערוץ המאיץ
#   {choice}  האפשרות שנבחרה
#   {command}  נתיב הפקודה
#   {companion}  מזהה המלווה
#   {companions}  מזהי המלווים
#   {count}  מספר הפריטים
#   {created}  זמן היצירה
#   {current}  הערך הנוכחי
#   {definition}  הגדרת המלווה
#   {detail}  פרטי הכשל
#   {effect}  מזהה אפקט החלקיקים
#   {enabled}  מצב המלווים
#   {feature}  שם התכונה
#   {features}  התכונות המופעלות
#   {field}  שם השדה בסדנה
#   {formation}  שם המערך
#   {group}  שם קטגוריית ההודעות
#   {hot_reload}  מצב הטעינה החמה
#   {index}  מספר המיקום
#   {integrations}  מצבי השילובים
#   {item}  שם הפריט
#   {items}  רשימת הפריטים
#   {java}  גרסת Java הראשית
#   {kept}  עריכות מקומיות שנשמרו בעדכון שפה
#   {key}  מפתח ההודעה או ההגדרה
#   {kind}  סוג העסקה
#   {language}  השפה הפעילה
#   {level}  מספר הרמה
#   {limit}  המגבלה שהוגדרה
#   {line}  מספר השורה בהודעה
#   {locale}  מזהה אזור השפה
#   {maximum}  הערך המרבי המותר
#   {mode}  כלל השילוב
#   {model}  דגם המלווה
#   {money}  סכום הכסף
#   {name}  שם התצוגה
#   {next}  הערך הבא
#   {number}  מספר הרשומה ברשימה
#   {operation}  פעולת הבונוס
#   {page}  מספר העמוד הנוכחי
#   {pages}  מספר העמודים הכולל
#   {parameter}  שם הפרמטר
#   {path}  נתיב קובץ או נתיב הגדרה
#   {percent}  ערך באחוזים
#   {permission}  ההרשאה הנדרשת
#   {personal}  אזור השפה האישי, אם הוא שונה
#   {player}  שם השחקן
#   {players}  מספר השחקנים הטעונים
#   {plugin}  שם התוסף
#   {prefix}  שם התוסף המעוצב מ-runtime.prefix
#   {provider}  ספק התשלום
#   {range}  טווח Minecraft הנתמך
#   {reason}  סיבת הכשל
#   {remaining}  הזמן שנותר עד שתותר בדיקת השפות הבאה
#   {required}  הכמות הנדרשת
#   {scheduler}  מימוש המתזמן
#   {seconds}  משך בשניות
#   {section}  מקטע בעורך השפה
#   {sources}  מקורות הבונוס
#   {status}  סימן המצב
#   {step}  צעד ההתאמה
#   {target}  יעד הבחירה
#   {tier}  דרגת השדרוג
#   {time}  טקסט המשך
#   {transaction}  מזהה העסקה
#   {type}  סוג הפרמטר
#   {updated}  הודעות ששונו בעדכון שפה
#   {url}  כתובת הדוח הציבורית
#   {usage}  שימוש בפקודה
#   {value}  ערך נוכחי או גולמי
#   {variables}  מצייני המקום התקפים בהודעה
#   {variant}  גרסת המראה
#   {version}  גרסת התוסף
#   {xp}  ניסיון המלווה

