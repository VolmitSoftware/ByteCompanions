# ByteCompanions — fi_FI
#
# === Tiedoston muokkaus ===
# plugins/ByteCompanions/languages/fi_FI.toml
# Voit muokata tätä tiedostoa suoraan. Paikalliset muutokset säilyvät; puuttuvat tai virheelliset kohdat käyttävät sisäänrakennettua englantia.
# /bytecompanions language server edit fi_FI
#
# === Etuliite ===
# runtime.prefix määrittää lisäosan muotoillun nimen muuttujalle {prefix}.
# Poista {prefix} viestistä, jos haluat piilottaa lisäosan nimen siitä viestistä.
#
# === Muotoilu ===
# Värit ja tyylit: &0-&f, &k-&r.
# RGB-värit: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage tukee mukautettua muotoilua, kuten <gold> ja <gradient:#ffcc00:#ff9900>. Jos haluat näyttää merkin & tai [ sellaisenaan, lisää sen eteen kenoviiva.
#
# === Muuttujat ===
# Säilytä muuttujien nimet ja käytä vain kunkin viestin omia muuttujia.
#   {activation}  Tehostimen aktivoinnin tunnus
#   {added}  Kielipäivityksen lisäämät viestit
#   {after}  Arvo muutoksen jälkeen
#   {amount}  Määrä tai lukumäärä
#   {argument}  Odottamaton komennon argumentti
#   {before}  Arvo ennen muutosta
#   {bonus}  Bonuksen nimi
#   {booster}  Tehostimen tunnus
#   {category}  Luokan nimi
#   {change}  Muutoksen kuvaus
#   {channel}  Tehostimen kanava
#   {choice}  Valittu vaihtoehto
#   {command}  Komentopolku
#   {companion}  Kumppanin tunnus
#   {companions}  Kumppanien tunnukset
#   {count}  Kohteiden määrä
#   {created}  Luontiaika
#   {current}  Nykyinen arvo
#   {definition}  Kumppanin määritys
#   {detail}  Virheen tarkempi kuvaus
#   {effect}  Hiukkastehosteen tunnus
#   {enabled}  Kumppanien tila
#   {feature}  Ominaisuuden nimi
#   {features}  Käytössä olevat ominaisuudet
#   {field}  Studion kentän nimi
#   {formation}  Muodostelman nimi
#   {group}  Viestiluokan nimi
#   {hot_reload}  Automaattisen uudelleenlatauksen tila
#   {index}  Järjestysnumero
#   {integrations}  Integraatioiden tilat
#   {item}  Esineen nimi
#   {items}  Esineluettelo
#   {java}  Javan pääversio
#   {kept}  Kielipäivityksessä säilytetyt paikalliset muokkaukset
#   {key}  Viestin tai asetuksen avain
#   {kind}  Tapahtuman tyyppi
#   {language}  Aktiivinen kieli
#   {level}  Tason numero
#   {limit}  Määritetty raja
#   {line}  Viestin rivinumero
#   {locale}  Kielitunnus
#   {maximum}  Suurin sallittu arvo
#   {mode}  Yhdistämissääntö
#   {model}  Kumppanin malli
#   {money}  Rahamäärä
#   {name}  Näyttönimi
#   {next}  Seuraava arvo
#   {number}  Luettelon kohteen numero
#   {operation}  Bonuksen laskutoimitus
#   {page}  Nykyisen sivun numero
#   {pages}  Sivujen kokonaismäärä
#   {parameter}  Parametrin nimi
#   {path}  Tiedostopolku tai asetuksen polku
#   {percent}  Prosenttiarvo
#   {permission}  Vaadittu käyttöoikeus
#   {personal}  Henkilökohtainen kielitunnus, jos se poikkeaa
#   {player}  Pelaajan nimi
#   {players}  Ladattujen pelaajien määrä
#   {plugin}  Lisäosan nimi
#   {prefix}  Lisäosan muotoiltu nimi avaimesta runtime.prefix
#   {provider}  Maksupalvelun tarjoaja
#   {range}  Tuettu Minecraft-versioväli
#   {reason}  Virheen syy
#   {remaining}  Aika seuraavaan sallittuun kielitarkistukseen
#   {required}  Vaadittu määrä
#   {scheduler}  Ajastimen toteutus
#   {seconds}  Kesto sekunteina
#   {section}  Kielieditorin osio
#   {sources}  Bonusten lähteet
#   {status}  Tilamerkintä
#   {step}  Säätöaskel
#   {target}  Valinnan kohde
#   {tier}  Parannusporras
#   {time}  Kesto tekstinä
#   {transaction}  Tapahtuman tunnus
#   {type}  Parametrin tyyppi
#   {updated}  Kielipäivityksen muuttamat viestit
#   {url}  Raportin julkinen URL
#   {usage}  Komennon käyttö
#   {value}  Nykyinen tai raaka-arvo
#   {variables}  Viestissä sallitut paikkamerkit
#   {variant}  Ulkoasun muunnelma
#   {version}  Lisäosan versio
#   {xp}  Kumppanin kokemus

