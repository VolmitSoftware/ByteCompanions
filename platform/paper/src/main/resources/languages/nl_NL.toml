# ByteCompanions — nl_NL
#
# === Bestand bewerken ===
# plugins/ByteCompanions/languages/nl_NL.toml
# Je kunt dit bestand rechtstreeks bewerken. Lokale wijzigingen blijven behouden; voor ontbrekende of ongeldige vermeldingen wordt het ingebouwde Engels gebruikt.
# /bytecompanions language server edit nl_NL
#
# === Voorvoegsel ===
# runtime.prefix levert de opgemaakte pluginnaam voor {prefix}.
# Verwijder {prefix} uit een bericht om de pluginnaam in dat bericht te verbergen.
#
# === Opmaak ===
# Kleuren en stijlen: &0-&f, &k-&r.
# RGB-kleuren: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage ondersteunt eigen opmaak zoals <gold> en <gradient:#ffcc00:#ff9900>. Zet een backslash voor & of [ om het teken letterlijk weer te geven.
#
# === Variabelen ===
# Behoud de namen van variabelen en gebruik alleen de variabelen die bij het bericht horen.
#   {activation}  Boosteractiverings-ID
#   {added}  Berichten toegevoegd door een taalupdate
#   {after}  Waarde na de wijziging
#   {amount}  Hoeveelheid of aantal
#   {argument}  Onverwacht opdrachtargument
#   {before}  Waarde vóór de wijziging
#   {bonus}  Naam van de bonus
#   {booster}  Booster-ID
#   {category}  Categorienaam
#   {change}  Beschreven wijziging
#   {channel}  Boosterkanaal
#   {choice}  Gekozen optie
#   {command}  Opdrachtpad
#   {companion}  Metgezel-ID
#   {companions}  Metgezel-ID's
#   {count}  Aantal items
#   {created}  Tijdstip van aanmaken
#   {current}  Huidige waarde
#   {definition}  Metgezeldefinitie
#   {detail}  Foutdetail
#   {effect}  ID van het deeltjeseffect
#   {enabled}  Status van metgezellen
#   {feature}  Functienaam
#   {features}  Ingeschakelde functies
#   {field}  Naam van het studioveld
#   {formation}  Formatienaam
#   {group}  Naam van de berichtcategorie
#   {hot_reload}  Status van automatisch herladen
#   {index}  Positienummer
#   {integrations}  Status van integraties
#   {item}  Voorwerpnaam
#   {items}  Lijst met voorwerpen
#   {java}  Hoofdversie van Java
#   {kept}  Lokale bewerkingen behouden door een taalupdate
#   {key}  Bericht- of instellingssleutel
#   {kind}  Soort transactie
#   {language}  Actieve taal
#   {level}  Level- of niveaunummer
#   {limit}  Ingestelde limiet
#   {line}  Regelnummer van het bericht
#   {locale}  Taalcode
#   {maximum}  Maximaal toegestane waarde
#   {mode}  Combinatieregel
#   {model}  Metgezelmodel
#   {money}  Geldbedrag
#   {name}  Weergavenaam
#   {next}  Volgende waarde
#   {number}  Nummer van de lijstvermelding
#   {operation}  Bonusbewerking
#   {page}  Huidig paginanummer
#   {pages}  Totaal aantal pagina's
#   {parameter}  Parameternaam
#   {path}  Bestands- of instellingspad
#   {percent}  Percentage
#   {permission}  Vereiste toestemming
#   {personal}  Persoonlijke taalcode als die afwijkt
#   {player}  Spelernaam
#   {players}  Aantal geladen spelers
#   {plugin}  Pluginnaam
#   {prefix}  Opgemaakte pluginnaam uit runtime.prefix
#   {provider}  Betalingsaanbieder
#   {range}  Ondersteund Minecraft-versiebereik
#   {reason}  Foutreden
#   {remaining}  Resterende tijd tot de volgende taalcontrole
#   {required}  Vereiste hoeveelheid
#   {scheduler}  Planner-implementatie
#   {seconds}  Duur in seconden
#   {section}  Onderdeel van de taaleditor
#   {sources}  Bonusbronnen
#   {status}  Statusmarkering
#   {step}  Aanpassingsstap
#   {target}  Selectiedoel
#   {tier}  Verbeteringsniveau
#   {time}  Duur als tekst
#   {transaction}  Transactie-ID
#   {type}  Parametertype
#   {updated}  Berichten gewijzigd door een taalupdate
#   {url}  Openbare rapport-URL
#   {usage}  Gebruik van de opdracht
#   {value}  Huidige of ruwe waarde
#   {variables}  Geldige tijdelijke aanduidingen voor het bericht
#   {variant}  Uiterlijkvariant
#   {version}  Pluginversie
#   {xp}  Metgezel-XP

