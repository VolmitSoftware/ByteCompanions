# ByteCompanions — pt_PT
#
# === Editar o ficheiro ===
# plugins/ByteCompanions/languages/pt_PT.toml
# Podes editar este ficheiro diretamente. As alterações locais são preservadas; as entradas em falta ou inválidas usam o inglês incorporado.
# /bytecompanions language server edit pt_PT
#
# === Prefixo ===
# runtime.prefix fornece o nome formatado do plugin para {prefix}.
# Remove {prefix} de uma mensagem para ocultar o nome do plugin nessa mensagem.
#
# === Formatação ===
# Cores e estilos: &0-&f, &k-&r.
# Cores RGB: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# O MiniMessage suporta formatação personalizada como <gold> e <gradient:#ffcc00:#ff9900>. Coloca uma barra invertida antes de & ou [ para apresentar o carácter literalmente.
#
# === Variáveis ===
# Mantém os nomes das variáveis e usa apenas as que pertencem a cada mensagem.
#   {activation}  Identificador da ativação do potenciador
#   {added}  Mensagens adicionadas por uma atualização de idioma
#   {after}  Valor após a alteração
#   {amount}  Quantidade ou número
#   {argument}  Argumento de comando inesperado
#   {before}  Valor antes da alteração
#   {bonus}  Nome do bónus
#   {booster}  Identificador do potenciador
#   {category}  Nome da categoria
#   {change}  Descrição da alteração
#   {channel}  Canal do potenciador
#   {choice}  Opção selecionada
#   {command}  Caminho do comando
#   {companion}  Identificador do companheiro
#   {companions}  Identificadores dos companheiros
#   {count}  Número de elementos
#   {created}  Data de criação
#   {current}  Valor atual
#   {definition}  Definição do companheiro
#   {detail}  Detalhe da falha
#   {effect}  Identificador do efeito de partículas
#   {enabled}  Estado dos companheiros
#   {feature}  Nome da funcionalidade
#   {features}  Funcionalidades ativas
#   {field}  Nome do campo do estúdio
#   {formation}  Nome da formação
#   {group}  Nome da categoria de mensagens
#   {hot_reload}  Estado do recarregamento automático
#   {index}  Número da posição
#   {integrations}  Estado das integrações
#   {item}  Nome do item
#   {items}  Lista de itens
#   {java}  Versão principal do Java
#   {kept}  Edições locais mantidas por uma atualização de idioma
#   {key}  Chave da mensagem ou da definição
#   {kind}  Tipo de transação
#   {language}  Idioma ativo
#   {level}  Número do nível
#   {limit}  Limite configurado
#   {line}  Número da linha da mensagem
#   {locale}  Código de idioma
#   {maximum}  Valor máximo aceite
#   {mode}  Regra de combinação
#   {model}  Modelo do companheiro
#   {money}  Quantia de dinheiro
#   {name}  Nome apresentado
#   {next}  Valor seguinte
#   {number}  Número da entrada da lista
#   {operation}  Operação do bónus
#   {page}  Número da página atual
#   {pages}  Número total de páginas
#   {parameter}  Nome do parâmetro
#   {path}  Caminho do ficheiro ou da definição
#   {percent}  Valor percentual
#   {permission}  Permissão necessária
#   {personal}  Código de idioma pessoal, quando é diferente
#   {player}  Nome do jogador
#   {players}  Número de jogadores carregados
#   {plugin}  Nome do plugin
#   {prefix}  Nome formatado do plugin em runtime.prefix
#   {provider}  Fornecedor de pagamentos
#   {range}  Intervalo de versões do Minecraft suportadas
#   {reason}  Motivo da falha
#   {remaining}  Tempo restante até à próxima verificação de idiomas
#   {required}  Quantidade necessária
#   {scheduler}  Implementação do agendador
#   {seconds}  Duração em segundos
#   {section}  Secção do editor de idiomas
#   {sources}  Fontes de bónus
#   {status}  Indicador de estado
#   {step}  Incremento do ajuste
#   {target}  Alvo da seleção
#   {tier}  Patamar de melhoria
#   {time}  Duração em texto
#   {transaction}  Identificador da transação
#   {type}  Tipo do parâmetro
#   {updated}  Mensagens alteradas por uma atualização de idioma
#   {url}  URL público do relatório
#   {usage}  Utilização do comando
#   {value}  Valor atual ou bruto
#   {variables}  Variáveis válidas para a mensagem
#   {variant}  Variante de aspeto
#   {version}  Versão do plugin
#   {xp}  Experiência do companheiro

