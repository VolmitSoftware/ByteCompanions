# ByteCompanions — es_ES
#
# === Editar el archivo ===
# plugins/ByteCompanions/languages/es_ES.toml
# Puedes editar este archivo directamente. Los cambios locales se conservan; las entradas que falten o no sean válidas usan el inglés integrado.
# /bytecompanions language server edit es_ES
#
# === Prefijo ===
# runtime.prefix proporciona el nombre del plugin con formato para {prefix}.
# Elimina {prefix} de un mensaje para ocultar el nombre del plugin en ese mensaje.
#
# === Formato ===
# Colores y estilos: &0-&f, &k-&r.
# Colores RGB: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage admite formatos personalizados como <gold> y <gradient:#ffcc00:#ff9900>. Antepón una barra invertida a & o [ para mostrarlos literalmente.
#
# === Variables ===
# Conserva los nombres de las variables y usa solo las que ya contiene cada mensaje.
#   {activation}  Identificador de la activación del potenciador
#   {added}  Mensajes añadidos por una actualización de idioma
#   {after}  Valor después del cambio
#   {amount}  Cantidad o número
#   {argument}  Argumento de comando inesperado
#   {before}  Valor antes del cambio
#   {bonus}  Nombre de la bonificación
#   {booster}  Identificador del potenciador
#   {category}  Nombre de la categoría
#   {change}  Descripción del cambio
#   {channel}  Canal del potenciador
#   {choice}  Opción seleccionada
#   {command}  Ruta del comando
#   {companion}  Identificador del compañero
#   {companions}  Identificadores de compañeros
#   {count}  Número de elementos
#   {created}  Fecha de creación
#   {current}  Valor actual
#   {definition}  Definición del compañero
#   {detail}  Detalle del fallo
#   {effect}  Identificador del efecto de partículas
#   {enabled}  Estado de los compañeros
#   {feature}  Nombre de la función
#   {features}  Funciones activadas
#   {field}  Nombre del campo del estudio
#   {formation}  Nombre de la formación
#   {group}  Nombre de la categoría de mensajes
#   {hot_reload}  Estado de la recarga en caliente
#   {index}  Número de posición
#   {integrations}  Estado de las integraciones
#   {item}  Nombre del objeto
#   {items}  Lista de objetos
#   {java}  Versión principal de Java
#   {kept}  Ediciones locales conservadas por una actualización de idioma
#   {key}  Clave del mensaje o del ajuste
#   {kind}  Tipo de transacción
#   {language}  Idioma activo
#   {level}  Número de nivel
#   {limit}  Límite configurado
#   {line}  Número de línea del mensaje
#   {locale}  Código de idioma
#   {maximum}  Valor máximo aceptado
#   {mode}  Regla de combinación
#   {model}  Modelo del compañero
#   {money}  Cantidad de dinero
#   {name}  Nombre visible
#   {next}  Valor siguiente
#   {number}  Número de la entrada de la lista
#   {operation}  Operación de la bonificación
#   {page}  Número de página actual
#   {pages}  Número total de páginas
#   {parameter}  Nombre del parámetro
#   {path}  Ruta del archivo o del ajuste
#   {percent}  Valor porcentual
#   {permission}  Permiso necesario
#   {personal}  Idioma personal, si es distinto
#   {player}  Nombre del jugador
#   {players}  Número de jugadores cargados
#   {plugin}  Nombre del plugin
#   {prefix}  Nombre del plugin con formato de runtime.prefix
#   {provider}  Proveedor de pagos
#   {range}  Rango de versiones de Minecraft compatibles
#   {reason}  Motivo del fallo
#   {remaining}  Tiempo restante hasta la próxima comprobación de idiomas
#   {required}  Cantidad necesaria
#   {scheduler}  Implementación del planificador
#   {seconds}  Duración en segundos
#   {section}  Sección del editor de idiomas
#   {sources}  Fuentes de bonificación
#   {status}  Indicador de estado
#   {step}  Paso de ajuste
#   {target}  Destino de la selección
#   {tier}  Rango de mejora
#   {time}  Duración en texto
#   {transaction}  Identificador de la transacción
#   {type}  Tipo del parámetro
#   {updated}  Mensajes cambiados por una actualización de idioma
#   {url}  URL pública del informe
#   {usage}  Uso del comando
#   {value}  Valor actual o sin procesar
#   {variables}  Variables válidas para el mensaje
#   {variant}  Variante de aspecto
#   {version}  Versión del plugin
#   {xp}  Experiencia del compañero

