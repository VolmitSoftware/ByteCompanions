# ByteCompanions — fr_FR
#
# === Modifier le fichier ===
# plugins/ByteCompanions/languages/fr_FR.toml
# Ce fichier peut être modifié directement. Les modifications locales sont conservées ; l’anglais intégré remplace les entrées manquantes ou invalides.
# /bytecompanions language server edit fr_FR
#
# === Préfixe ===
# runtime.prefix fournit le nom formaté du plugin pour {prefix}.
# Supprimez {prefix} d’un message pour y masquer le nom du plugin.
#
# === Mise en forme ===
# Couleurs et styles : &0-&f, &k-&r.
# Couleurs RVB : &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage prend en charge les formats personnalisés comme <gold> et <gradient:#ffcc00:#ff9900>. Ajoutez une barre oblique inverse devant & ou [ pour l’afficher littéralement.
#
# === Variables ===
# Conservez les noms des variables et utilisez uniquement celles du message concerné.
#   {activation}  Identifiant de l’activation du booster
#   {added}  Messages ajoutés par une mise à jour de langue
#   {after}  Valeur après la modification
#   {amount}  Quantité ou nombre
#   {argument}  Argument de commande inattendu
#   {before}  Valeur avant la modification
#   {bonus}  Nom du bonus
#   {booster}  Identifiant du booster
#   {category}  Nom de la catégorie
#   {change}  Description de la modification
#   {channel}  Canal du booster
#   {choice}  Option sélectionnée
#   {command}  Chemin de la commande
#   {companion}  Identifiant du compagnon
#   {companions}  Identifiants des compagnons
#   {count}  Nombre d’éléments
#   {created}  Date de création
#   {current}  Valeur actuelle
#   {definition}  Définition du compagnon
#   {detail}  Détail de l’échec
#   {effect}  Identifiant de l’effet de particules
#   {enabled}  État des compagnons
#   {feature}  Nom de la fonctionnalité
#   {features}  Fonctionnalités activées
#   {field}  Nom du champ de l’atelier
#   {formation}  Nom de la formation
#   {group}  Nom de la catégorie de messages
#   {hot_reload}  État du rechargement automatique
#   {index}  Numéro de position
#   {integrations}  État des intégrations
#   {item}  Nom de l’objet
#   {items}  Liste des objets
#   {java}  Version majeure de Java
#   {kept}  Modifications locales conservées par une mise à jour de langue
#   {key}  Clé du message ou du réglage
#   {kind}  Type de transaction
#   {language}  Langue active
#   {level}  Numéro de niveau
#   {limit}  Limite configurée
#   {line}  Numéro de ligne du message
#   {locale}  Code de langue
#   {maximum}  Valeur maximale autorisée
#   {mode}  Règle de combinaison
#   {model}  Modèle du compagnon
#   {money}  Montant d’argent
#   {name}  Nom affiché
#   {next}  Valeur suivante
#   {number}  Numéro de l’entrée de la liste
#   {operation}  Opération du bonus
#   {page}  Numéro de la page actuelle
#   {pages}  Nombre total de pages
#   {parameter}  Nom du paramètre
#   {path}  Chemin du fichier ou du réglage
#   {percent}  Pourcentage
#   {permission}  Permission requise
#   {personal}  Code de langue personnel, s’il diffère
#   {player}  Nom du joueur
#   {players}  Nombre de joueurs chargés
#   {plugin}  Nom du plugin
#   {prefix}  Nom formaté du plugin défini par runtime.prefix
#   {provider}  Fournisseur de paiement
#   {range}  Plage de versions Minecraft prises en charge
#   {reason}  Motif de l’échec
#   {remaining}  Délai restant avant la prochaine vérification des langues
#   {required}  Quantité requise
#   {scheduler}  Implémentation du planificateur
#   {seconds}  Durée en secondes
#   {section}  Section de l’éditeur de langue
#   {sources}  Sources de bonus
#   {status}  Marqueur d’état
#   {step}  Pas d’ajustement
#   {target}  Cible de la sélection
#   {tier}  Palier d’amélioration
#   {time}  Durée sous forme de texte
#   {transaction}  Identifiant de la transaction
#   {type}  Type de paramètre
#   {updated}  Messages modifiés par une mise à jour de langue
#   {url}  URL publique du rapport
#   {usage}  Utilisation de la commande
#   {value}  Valeur actuelle ou brute
#   {variables}  Variables valides pour le message
#   {variant}  Variante d’apparence
#   {version}  Version du plugin
#   {xp}  XP du compagnon

