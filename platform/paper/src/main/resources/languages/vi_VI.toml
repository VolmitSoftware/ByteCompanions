# ByteCompanions — vi_VI
#
# === Chỉnh sửa tệp ===
# plugins/ByteCompanions/languages/vi_VI.toml
# Bạn có thể chỉnh sửa trực tiếp tệp này. Thay đổi cục bộ được giữ lại; mục thiếu hoặc không hợp lệ dùng bản tiếng Anh tích hợp.
# /bytecompanions language server edit vi_VI
#
# === Tiền tố ===
# runtime.prefix cung cấp tên plugin có định dạng cho {prefix}.
# Xóa {prefix} khỏi một thông báo để ẩn tên plugin trong thông báo đó.
#
# === Định dạng ===
# Màu và kiểu chữ: &0-&f, &k-&r.
# Màu RGB: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage hỗ trợ định dạng tùy chỉnh như <gold> và <gradient:#ffcc00:#ff9900>. Thêm dấu gạch chéo ngược trước & hoặc [ để hiển thị nguyên ký tự đó.
#
# === Biến ===
# Giữ nguyên tên biến và chỉ dùng những biến có sẵn trong từng thông báo.
#   {activation}  Mã định danh lượt kích hoạt bộ tăng thưởng
#   {added}  Thông báo được thêm bởi bản cập nhật ngôn ngữ
#   {after}  Giá trị sau khi thay đổi
#   {amount}  Số lượng
#   {argument}  Đối số lệnh ngoài dự kiến
#   {before}  Giá trị trước khi thay đổi
#   {bonus}  Tên mức thưởng
#   {booster}  Mã định danh bộ tăng thưởng
#   {category}  Tên danh mục
#   {change}  Mô tả thay đổi
#   {channel}  Kênh của bộ tăng thưởng
#   {choice}  Tùy chọn đã chọn
#   {command}  Đường dẫn lệnh
#   {companion}  Mã định danh bạn đồng hành
#   {companions}  Các mã định danh bạn đồng hành
#   {count}  Số mục
#   {created}  Thời điểm tạo
#   {current}  Giá trị hiện tại
#   {definition}  Định nghĩa bạn đồng hành
#   {detail}  Chi tiết lỗi
#   {effect}  Mã định danh hiệu ứng hạt
#   {enabled}  Trạng thái bật của bạn đồng hành
#   {feature}  Tên tính năng
#   {features}  Các tính năng đang bật
#   {field}  Tên trường trong xưởng
#   {formation}  Tên đội hình
#   {group}  Tên danh mục thông báo
#   {hot_reload}  Trạng thái tải lại tức thời
#   {index}  Số thứ tự vị trí
#   {integrations}  Trạng thái tích hợp
#   {item}  Tên vật phẩm
#   {items}  Danh sách vật phẩm
#   {java}  Phiên bản chính của Java
#   {kept}  Chỉnh sửa cục bộ được giữ lại sau bản cập nhật ngôn ngữ
#   {key}  Khóa thông báo hoặc cài đặt
#   {kind}  Loại giao dịch
#   {language}  Ngôn ngữ đang dùng
#   {level}  Số cấp
#   {limit}  Giới hạn đã cấu hình
#   {line}  Số dòng của thông báo
#   {locale}  Mã vùng
#   {maximum}  Giá trị tối đa được chấp nhận
#   {mode}  Quy tắc kết hợp
#   {model}  Mô hình bạn đồng hành
#   {money}  Số tiền
#   {name}  Tên hiển thị
#   {next}  Giá trị tiếp theo
#   {number}  Số thứ tự mục trong danh sách
#   {operation}  Phép tính của mức thưởng
#   {page}  Số trang hiện tại
#   {pages}  Tổng số trang
#   {parameter}  Tên tham số
#   {path}  Đường dẫn tệp hoặc đường dẫn cài đặt
#   {percent}  Giá trị phần trăm
#   {permission}  Quyền cần có
#   {personal}  Mã vùng cá nhân khi khác với mặc định của máy chủ
#   {player}  Tên người chơi
#   {players}  Số người chơi đã tải
#   {plugin}  Tên plugin
#   {prefix}  Tên plugin có định dạng từ runtime.prefix
#   {provider}  Nhà cung cấp thanh toán
#   {range}  Phạm vi phiên bản Minecraft được hỗ trợ
#   {reason}  Lý do thất bại
#   {remaining}  Thời gian còn lại đến lần kiểm tra ngôn ngữ tiếp theo
#   {required}  Số lượng yêu cầu
#   {scheduler}  Bộ lập lịch đang dùng
#   {seconds}  Thời lượng tính bằng giây
#   {section}  Mục của trình chỉnh sửa ngôn ngữ
#   {sources}  Nguồn thưởng
#   {status}  Dấu trạng thái
#   {step}  Bước điều chỉnh
#   {target}  Đối tượng được chọn
#   {tier}  Bậc nâng cấp
#   {time}  Văn bản thời lượng
#   {transaction}  Mã định danh giao dịch
#   {type}  Kiểu tham số
#   {updated}  Thông báo được thay đổi bởi bản cập nhật ngôn ngữ
#   {url}  URL công khai của báo cáo
#   {usage}  Cách dùng lệnh
#   {value}  Giá trị hiện tại hoặc thô
#   {variables}  Biến dùng được trong thông báo
#   {variant}  Biến thể ngoại hình
#   {version}  Phiên bản plugin
#   {xp}  Kinh nghiệm bạn đồng hành

