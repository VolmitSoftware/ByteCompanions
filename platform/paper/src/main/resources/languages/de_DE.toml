# ByteCompanions — de_DE
#
# === Datei bearbeiten ===
# plugins/ByteCompanions/languages/de_DE.toml
# Diese Datei kann direkt bearbeitet werden. Lokale Änderungen bleiben erhalten; für fehlende oder ungültige Einträge wird das eingebaute Englisch verwendet.
# /bytecompanions language server edit de_DE
#
# === Präfix ===
# runtime.prefix liefert den formatierten Pluginnamen für {prefix}.
# Entferne {prefix} aus einer Nachricht, um den Pluginnamen in dieser Nachricht auszublenden.
#
# === Formatierung ===
# Farben und Stile: &0-&f, &k-&r.
# RGB-Farben: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage unterstützt eigene Formatierungen wie <gold> und <gradient:#ffcc00:#ff9900>. Ein vorangestellter Backslash zeigt & oder [ wörtlich an.
#
# === Variablen ===
# Lass die Variablennamen unverändert und verwende nur die Variablen der jeweiligen Nachricht.
#   {activation}  Booster-Aktivierungs-ID
#   {added}  Durch eine Sprachaktualisierung hinzugefügte Nachrichten
#   {after}  Wert nach der Änderung
#   {amount}  Menge oder Anzahl
#   {argument}  Unerwartetes Befehlsargument
#   {before}  Wert vor der Änderung
#   {bonus}  Name des Bonus
#   {booster}  Booster-ID
#   {category}  Name der Kategorie
#   {change}  Beschriebene Änderung
#   {channel}  Booster-Kanal
#   {choice}  Gewählte Option
#   {command}  Befehlspfad
#   {companion}  Begleiter-ID
#   {companions}  Begleiter-IDs
#   {count}  Anzahl der Einträge
#   {created}  Erstellungszeit
#   {current}  Aktueller Wert
#   {definition}  Begleiterdefinition
#   {detail}  Fehlerdetail
#   {effect}  Partikeleffekt-ID
#   {enabled}  Status der Begleiter
#   {feature}  Name der Funktion
#   {features}  Aktivierte Funktionen
#   {field}  Name des Studiofelds
#   {formation}  Name der Formation
#   {group}  Name der Nachrichtenkategorie
#   {hot_reload}  Status des automatischen Neuladens
#   {index}  Positionsnummer
#   {integrations}  Status der Integrationen
#   {item}  Gegenstandsname
#   {items}  Gegenstandsliste
#   {java}  Java-Hauptversion
#   {kept}  Bei einer Sprachaktualisierung behaltene lokale Änderungen
#   {key}  Nachrichten- oder Einstellungsschlüssel
#   {kind}  Transaktionsart
#   {language}  Aktive Sprache
#   {level}  Level- oder Stufennummer
#   {limit}  Konfiguriertes Limit
#   {line}  Zeilennummer der Nachricht
#   {locale}  Sprachkennung
#   {maximum}  Höchster zulässiger Wert
#   {mode}  Kombinationsregel
#   {model}  Begleitermodell
#   {money}  Geldbetrag
#   {name}  Anzeigename
#   {next}  Nächster Wert
#   {number}  Nummer des Listeneintrags
#   {operation}  Bonusoperation
#   {page}  Aktuelle Seitennummer
#   {pages}  Gesamtzahl der Seiten
#   {parameter}  Parametername
#   {path}  Datei- oder Einstellungspfad
#   {percent}  Prozentwert
#   {permission}  Erforderliche Berechtigung
#   {personal}  Persönliche Sprachkennung, falls sie abweicht
#   {player}  Spielername
#   {players}  Anzahl geladener Spieler
#   {plugin}  Pluginname
#   {prefix}  Formatierter Pluginname aus runtime.prefix
#   {provider}  Zahlungsanbieter
#   {range}  Unterstützter Minecraft-Versionsbereich
#   {reason}  Fehlergrund
#   {remaining}  Verbleibende Wartezeit bis zur nächsten Sprachprüfung
#   {required}  Benötigte Menge
#   {scheduler}  Scheduler-Implementierung
#   {seconds}  Dauer in Sekunden
#   {section}  Abschnitt des Spracheditors
#   {sources}  Bonusquellen
#   {status}  Statusmarkierung
#   {step}  Anpassungsschritt
#   {target}  Auswahlziel
#   {tier}  Verbesserungsstufe
#   {time}  Dauer als Text
#   {transaction}  Transaktions-ID
#   {type}  Parametertyp
#   {updated}  Durch eine Sprachaktualisierung geänderte Nachrichten
#   {url}  Öffentliche Berichts-URL
#   {usage}  Befehlsverwendung
#   {value}  Aktueller oder Rohwert
#   {variables}  Gültige Platzhalter der Nachricht
#   {variant}  Aussehensvariante
#   {version}  Plugin-Version
#   {xp}  Begleiter-EP

