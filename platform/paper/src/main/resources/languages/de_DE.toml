# ByteCompanions — de_DE
#
# === Datei bearbeiten ===
# plugins/ByteCompanions/languages/de_DE.toml
# Diese Datei kann direkt bearbeitet werden. Lokale Änderungen bleiben erhalten; fehlende oder ungültige Einträge verwenden das eingebaute Englisch.
# /bytecompanions language server edit de_DE
#
# === Präfix ===
# runtime.prefix supplies the styled plugin name for {prefix}.
# Remove {prefix} from a message to hide the plugin name for that message.
#
# === Formatierung ===
# Colors and styles: &0-&f, &k-&r.
# RGB colors: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage supports custom formatting such as <gold> and <gradient:#ffcc00:#ff9900>. Put a backslash before & or [ to display it literally.
#
# === Variablen ===
# Variablennamen unverändert lassen und nur die Variablen der jeweiligen Nachricht verwenden.
#   {action}  Requested action
#   {actions}  Available actions
#   {after}  Value after the change
#   {amount}  Amount or count
#   {argument}  Unexpected command argument
#   {before}  Value before the change
#   {bonus}  Bonus name
#   {booster}  Booster identifier
#   {category}  Category name
#   {change}  Described change
#   {channel}  Booster channel
#   {choice}  Selected option
#   {command}  Command path
#   {companion}  Companion identifier
#   {companions}  Companion identifiers
#   {count}  Number of items
#   {created}  Creation time
#   {current}  Current value
#   {definition}  Companion definition
#   {detail}  Failure detail
#   {effect}  Particle effect identifier
#   {entry}  Entry label
#   {feature}  Feature name
#   {features}  Enabled features
#   {field}  Studio field name
#   {formation}  Formation name
#   {group}  Message category name
#   {hot_reload}  Hot reload state
#   {index}  Position number
#   {integrations}  Integration states
#   {item}  Item name
#   {items}  Item list
#   {java}  Java major version
#   {key}  Message or setting key
#   {kind}  Transaction kind
#   {language}  Active language
#   {level}  Level number
#   {limit}  Configured limit
#   {line}  Message line number
#   {locale}  Locale identifier
#   {maximum}  Maximum accepted value
#   {mode}  Combining rule
#   {model}  Companion model
#   {money}  Money amount
#   {name}  Display name
#   {new}  Installed rendered value
#   {next}  Next value
#   {old}  Previous rendered value
#   {operation}  Bonus operation
#   {page}  Current page number
#   {pages}  Total page count
#   {parameter}  Parameter name
#   {path}  File path or setting path
#   {percent}  Percentage value
#   {permission}  Required permission
#   {personal}  Personal locale when it differs
#   {player}  Player name
#   {players}  Loaded player count
#   {plugin}  Plugin name
#   {prefix}  Styled plugin name from runtime.prefix
#   {provider}  Payment provider
#   {range}  Supported Minecraft range
#   {reason}  Failure reason
#   {required}  Required amount
#   {scheduler}  Scheduler implementation
#   {seconds}  Duration in seconds
#   {section}  Language editor section
#   {setting}  Setting name
#   {sources}  Bonus sources
#   {status}  Status marker
#   {step}  Adjustment step
#   {target}  Selection target
#   {tier}  Upgrade tier
#   {time}  Duration text
#   {transaction}  Transaction identifier
#   {type}  Parameter type
#   {url}  Public report URL
#   {usage}  Command usage
#   {value}  Current or raw value
#   {variables}  Placeholders valid for the message
#   {variant}  Appearance variant
#   {version}  Plugin version
#   {xp}  Companion experience

