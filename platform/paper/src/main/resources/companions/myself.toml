model = "FULL_BODY"
exclusive = false

[display]
category = "miniatures"

[display.item]
type = "skull"
source = "player"
value = "{player}"
name = "<gradient:#8DDBEA:#71A7E3>👤 Mini Me</gradient>"
lore = ["<#D1E8F5>A floating miniature wearing your head.", "<#D1E8F5>Blue travel clothes and a small compass.", "", "<#8DDBEA>Your player skin • No resource pack"]

[appearance]
small = true
visible = true
show-arms = true
show-base-plate = false
marker = false
custom-name = "<#8DDBEA>{player}'s Mini Me"
